var stage=document.getElementById('stage'), canvas=document.getElementById('canvas');
var viewer=document.getElementById('viewer'), mainBox=document.getElementById('mainBox');
var mediaHolder=document.getElementById('mediaHolder'), mediaCaption=document.getElementById('mediaCaption');
var titleEl=document.getElementById('title'), counterEl=document.getElementById('counter');
var prevNav=document.getElementById('prevNav'), nextNav=document.getElementById('nextNav');
var thumbPrev=document.getElementById('thumbPrev'), thumbNext=document.getElementById('thumbNext');
var W=3553, H=3477, scale=1, tx=0, ty=0;
var dragging=false, moved=false, sx=0, sy=0, stx=0, sty=0;
var point=-1, cur=0, opened=false;
/* 多点触控状态：pointers 记录每个触点的画布内坐标 */
var pointers={}, pinchDist=0, pinchScale=1, pinchMid={x:0,y:0}, pinchTx=0, pinchTy=0;
function localPt(e){ var r=stage.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function twoPts(){ var a=[]; for(var k in pointers) a.push(pointers[k]); return a; }
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function clampScale(s){ return Math.max(0.05, Math.min(12, s)); }
function zoomAt(px,py,ns){
  ns=clampScale(ns); var k=ns/scale;
  tx=px-(px-tx)*k; ty=py-(py-ty)*k; scale=ns; apply();
}

/* 生成隐形菱形触发按钮：25x38px 覆盖菱形紫色填充与黑色外框 */
(function(){
  for(var i=0;i<DATA.length;i++){
    var b=document.createElement('button');
    b.className='hot';
    b.setAttribute('data-i',i);
    b.setAttribute('aria-label',DATA[i].name+'（'+DATA[i].desc+'）');
    b.style.left=(DATA[i].x-12.5)+'px';
    b.style.top=(DATA[i].y-18)+'px';
    b.addEventListener('click',function(e){
      if(moved) return;
      e.stopPropagation();
      openViewer(parseInt(this.getAttribute('data-i'),10));
    });
    canvas.appendChild(b);
  }
})();

function apply(){ canvas.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')'; }
/* 取视口尺寸并兜底：某些浏览器在脚本执行时 clientWidth 可能为 0，
   若不兜底会导致 scale=0、底图被缩成一个点，表现为“白屏/打不开” */
function viewSize(){
  var w=stage.clientWidth||window.innerWidth||document.documentElement.clientWidth||1024;
  var h=stage.clientHeight||window.innerHeight||document.documentElement.clientHeight||768;
  return {w:w,h:h};
}
function fit(){
  var v=viewSize(), vw=v.w, vh=v.h;
  if(!vw||!vh) { vw=1024; vh=768; }
  /* 手机等窄屏首次进入按宽度铺满，便于阅读；宽屏保留整图适配 */
  var isNarrow = Math.min(vw,vh) < 700;
  scale = isNarrow ? vw/W : Math.min(vw/W,vh/H);
  if(!(scale>0)) scale=Math.min(vw/W,vh/H); /* 二次兜底，绝不允许 0 */
  if(!(scale>0)) scale=0.2;
  scale=clampScale(scale);
  tx=(vw-W*scale)/2;
  ty=(vh-H*scale)/2;
  if(isNarrow && ty>0) ty=0;
  apply();
}
/* 鼠标滚轮缩放 */
stage.addEventListener('wheel',function(e){
  if(opened) return;
  e.preventDefault();
  var r=stage.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  zoomAt(px,py,scale*Math.exp(-e.deltaY*0.0016));
},{passive:false});

/* 触点按下：单指拖动，双指进入捏合 */
stage.addEventListener('pointerdown',function(e){
  if(opened) return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  /* 仅触摸/触控笔需要捕获指针以支持移出元素后的拖动；
     鼠标绝不能捕获，否则 click 会被派发到 stage 而非菱形按钮，导致电脑上点不出来 */
  if(e.pointerType!=='mouse'){ try{ stage.setPointerCapture(e.pointerId); }catch(err){} }
  var p=localPt(e);
  pointers[e.pointerId]={x:p.x,y:p.y};
  var pts=twoPts();
  if(pts.length===1){
    dragging=true; moved=false; sx=p.x; sy=p.y; stx=tx; sty=ty;
    stage.classList.add('grabbing');
  }else if(pts.length===2){
    dragging=false; moved=true;
    pinchDist=dist(pts[0],pts[1])||1;
    pinchScale=scale; pinchTx=tx; pinchTy=ty;
    pinchMid={x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
    stage.classList.remove('grabbing');
  }
});

/* 触点移动 */
window.addEventListener('pointermove',function(e){
  if(opened) return;
  if(!(e.pointerId in pointers)) return;
  var p=localPt(e);
  pointers[e.pointerId]={x:p.x,y:p.y};
  var pts=twoPts();
  if(pts.length>=2){
    var d=dist(pts[0],pts[1]);
    var ns=clampScale(pinchScale*d/pinchDist);
    var mid={x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
    /* 以两指中点为锚点缩放：让“按下瞬间位于中点的地图内容点”缩放后仍停在中点。
       k 必须相对初始 pinchScale（与 pinchTx/pinchMid 同一基准），
       不能用 ns/scale（上一帧基准），否则逐帧累乘导致焦点漂移。 */
    var k=ns/pinchScale;
    tx=mid.x-(pinchMid.x-pinchTx)*k;
    ty=mid.y-(pinchMid.y-pinchTy)*k;
    scale=ns; moved=true; apply();
  }else if(dragging && pts.length===1){
    var dx=p.x-sx, dy=p.y-sy;
    if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
    tx=stx+dx; ty=sty+dy; apply();
  }
});

/* 触点抬起/取消 */
function endPointer(e){
  delete pointers[e.pointerId];
  var pts=twoPts();
  if(pts.length===1){
    /* 从双指回到单指，用剩余触点重置拖动基准，避免跳变 */
    dragging=true; moved=true;
    sx=pts[0].x; sy=pts[0].y; stx=tx; sty=ty;
    stage.classList.add('grabbing');
  }else if(pts.length===0){
    dragging=false; pinchDist=0; stage.classList.remove('grabbing');
    setTimeout(function(){ moved=false; },0);
  }
}
window.addEventListener('pointerup',endPointer);
window.addEventListener('pointercancel',endPointer);

/* 双击放大（桌面） */
stage.addEventListener('dblclick',function(e){
  if(opened) return;
  var r=stage.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, scale*(scale<1?2.4:1.6));
});

/* 屏幕缩放按钮 */
function zoomCenter(f){
  var r=stage.getBoundingClientRect();
  zoomAt(r.width/2, r.height/2, scale*f);
}
document.getElementById('zoomIn').addEventListener('pointerdown',function(e){e.stopPropagation();});
document.getElementById('zoomOut').addEventListener('pointerdown',function(e){e.stopPropagation();});
document.getElementById('zoomFit').addEventListener('pointerdown',function(e){e.stopPropagation();});
document.getElementById('zoomIn').addEventListener('click',function(e){e.stopPropagation();zoomCenter(1.5);});
document.getElementById('zoomOut').addEventListener('click',function(e){e.stopPropagation();zoomCenter(1/1.5);});
document.getElementById('zoomFit').addEventListener('click',function(e){e.stopPropagation();fit();});

function stopMedia(){
  var old=mediaHolder.querySelector('video');
  if(old){ try{ old.pause(); old.removeAttribute('src'); old.load(); }catch(err){} }
  mediaHolder.innerHTML='';
  mediaCaption.textContent='';
}
/* 视频 9 秒仍未起播时，浮层提示并给直链（弱网/解码不支持时的退路） */
function slowTip(v,item){
  var t=document.createElement('div');
  t.className='slowTip';
  t.appendChild(document.createTextNode('视频加载较慢'));
  var a=document.createElement('a');
  a.href=item.p; a.target='_blank'; a.rel='noopener'; a.textContent='在新窗口播放';
  t.appendChild(a);
  var done=false;
  function clear(){ done=true; if(t.parentNode) t.parentNode.removeChild(t); }
  v.addEventListener('playing',clear);
  v.addEventListener('timeupdate',function(){ if(v.currentTime>0.2) clear(); });
  v.addEventListener('error',function(){ if(!done && mediaHolder.contains(v)) mediaHolder.appendChild(t); });
  setTimeout(function(){ if(!done && (!v.readyState || v.readyState<3)) mediaHolder.appendChild(t); },9000);
}
function fillThumb(el,item){
  el.innerHTML='';
  var img=document.createElement('img');
  img.src=item?item.t:'';
  img.alt='';
  img.onerror=function(){ el.innerHTML='<span class="ph">&#9654;</span>'; };
  el.appendChild(img);
  if(item){
    var lb=document.createElement('div'); lb.className='thumbLabel'; lb.textContent=item.l;
    el.appendChild(lb);
  }
}
function render(){
  stopMedia();
  if(point<0) return;
  var list=DATA[point].media, item=list[cur], el;
  if(item.v){
    el=document.createElement('video');
    el.src=item.p; el.controls=true; el.playsInline=true;
    el.setAttribute('playsinline',''); el.loop=false;
    el.id='mainMedia';
    mediaHolder.appendChild(el);
    slowTip(el,item);
    var p=el.play();
    if(p&&p.catch) p.catch(function(){ el.muted=true; var q=el.play(); if(q&&q.catch) q.catch(function(){}); });
  }else{
    el=document.createElement('img');
    el.src=item.p; el.alt=item.l;
    el.id='mainMedia';
    mediaHolder.appendChild(el);
  }
  titleEl.textContent=DATA[point].name;
  counterEl.textContent=(cur+1)+' / '+list.length+'  '+item.l;
  mediaCaption.textContent=item.l;
  var many=list.length>1;
  prevNav.hidden=!many; nextNav.hidden=!many;
  thumbPrev.hidden=!many; thumbNext.hidden=!many;
  if(many){
    fillThumb(thumbPrev,list[(cur-1+list.length)%list.length]);
    fillThumb(thumbNext,list[(cur+1)%list.length]);
  }
}
function openViewer(i){
  if(!DATA[i]||!DATA[i].media.length) return;
  point=i; cur=0; opened=true;
  viewer.classList.add('open');
  document.getElementById('zoomCtl').hidden=true;
  render();
}
function closeViewer(){
  if(!opened) return;
  stopMedia(); opened=false; point=-1;
  viewer.classList.remove('open');
  document.getElementById('zoomCtl').hidden=false;
}
function step(d){
  if(!opened||point<0) return;
  var n=DATA[point].media.length;
  if(n<2) return;
  cur=(cur+d+n)%n; render();
}
document.getElementById('close').addEventListener('click',function(e){ e.stopPropagation(); closeViewer(); });
document.getElementById('mask').addEventListener('click',closeViewer);
prevNav.addEventListener('click',function(e){ e.stopPropagation(); step(-1); });
nextNav.addEventListener('click',function(e){ e.stopPropagation(); step(1); });
thumbPrev.addEventListener('click',function(e){ e.stopPropagation(); step(-1); });
thumbNext.addEventListener('click',function(e){ e.stopPropagation(); step(1); });
document.addEventListener('keydown',function(e){
  if(!opened) return;
  if(e.key==='Escape') closeViewer();
  else if(e.key==='ArrowLeft') step(-1);
  else if(e.key==='ArrowRight') step(1);
});
window.addEventListener('resize',fit);
/* 底图加载失败给出明确提示，避免纯白屏无从排查 */
(function(){
  var img=document.getElementById('basemap');
  if(img && !img.complete){ img.addEventListener('error',function(){ document.getElementById('errTip').style.display='block'; }); }
  if(img && img.complete && img.naturalWidth===0){ document.getElementById('errTip').style.display='block'; }
})();
fit();
/* 图片真正解码完成后再校准一次，防止脚本早于布局执行导致的尺寸偏差 */
window.addEventListener('load',function(){ fit(); });
if(document.getElementById('basemap') && document.getElementById('basemap').complete){ fit(); }
</script>
